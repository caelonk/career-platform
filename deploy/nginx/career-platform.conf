# Copied from the Azure VM, /etc/nginx/sites-available/career-platform, on 2026-10-21
# (the only enabled site). The port-80 version was written on 2026-10-05
# (docs/superpowers/plans/2026-10-01-operate-the-vm.md, section 3); Certbot's Nginx
# plugin then added the lines marked "managed by Certbot": port 443 with the Let's Encrypt
# certificate, and a 301 from port 80 to https:// for the two site names. A request on
# port 80 for any other name (such as the bare IP) gets 404.
server {
    server_name caelonk.me www.caelonk.me;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/caelonk.me/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/caelonk.me/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.caelonk.me) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = caelonk.me) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80 default_server;
    listen [::]:80 default_server;
    server_name caelonk.me www.caelonk.me;
    return 404; # managed by Certbot




}
