# As installed on the Azure VM at /etc/nginx/sites-available/career-platform on
# 2026-10-05, the only enabled site. Results: docs/superpowers/plans/2026-10-01-operate-the-vm.md
# (section 3).
#
# HTTPS was added later with Certbot's Nginx plugin (authenticator and installer
# `nginx`), which edits this file on the VM to serve port 443 with
# /etc/letsencrypt/live/caelonk.me/fullchain.pem and privkey.pem and to send port 80 a
# 301 to https://. The edited copy was not saved before the VM was deallocated, so this
# file is the version before HTTPS. The HTTPS result is recorded in
# docs/how-this-site-is-secured.md (ports 80 and 443, the 301, and the certificate).
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
