# AWS EC2: install at /etc/nginx/sites-available/career-platform and link it into
# sites-enabled (remove the stock "default" site). Plan Task 5.
# This is the port-80 version. In Task 7, Certbot's Nginx plugin adds the port-443 block
# for aws.caelonk.me and turns port 80 for that name into a 301 to https://.
# Any other Host (such as the bare IP) gets 404.
server {
    listen 80;
    server_name aws.caelonk.me;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80 default_server;
    server_name _;
    return 404;
}
