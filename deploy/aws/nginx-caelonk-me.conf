# AWS EC2: /etc/nginx/sites-available/caelonk-me, linked into sites-enabled. Copied from the
# server at cutover, 2026-11-02 (plan Task 9). The certificate was first issued by DNS-01,
# then re-issued with the nginx authenticator so certbot.timer renews it automatically.
server {
    listen 443 ssl;
    server_name caelonk.me;
    ssl_certificate /etc/letsencrypt/live/caelonk.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/caelonk.me/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name caelonk.me;
    return 301 https://$host$request_uri;
}
